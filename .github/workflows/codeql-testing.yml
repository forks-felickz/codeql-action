name: Test CodeQL tools version inputs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: tools ${{ matrix.tools }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        tools:
          # Exact CodeQL CLI versions, with and without the optional v prefix.
          - "1.28.1"
          - "v1.28.1"
          - "2.20.1"
          - "v2.20.1"

          # Major and minor partial versions.
          - "1.x"
          - "1.28"
          - "1.28.x"
          - "2.x"
          - "v2.x"
          - "2.20"
          - "2.20.x"
          - "v2.20.x"

          # Tilde and caret ranges.
          - "~1.28.0"
          - "^1.28.0"
          - "~2.20.0"
          - "^2.20.0"

          # Comparator sets.
          - ">=1.28.0 <2.0.0"
          - ">=2.0.0"
          - ">2.19.0"
          - "<2.21.0"
          - "<=2.20.1"
          - ">=2.20.0 <2.21.0"
          - ">=2.20.0 <=2.20.7"

          # Hyphen and OR ranges.
          - "1.28.0 - 1.28.9"
          - "2.19.0 - 2.20.7"
          - "1.28.x || 2.20.x"
          - "^1.28.0 || ^2.20.0"

          # Offsets into the stable CodeQL bundle release history.
          - "latest-0"
          - "latest-1"
          - "latest-2"
          - "latest-3"
          - "latest-5"
          - "latest-10"
          - "latest-25"
          - "latest-50"
          - "latest-100"
          - "latest-500"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        id: init
        uses: ./init
        with:
          languages: python
          build-mode: none
          tools: ${{ matrix.tools }}

      - name: Print resolved CodeQL version
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
        run: '"$CODEQL" version --format=json'

      - name: Analyze
        uses: ./analyze
        with:
          category: /language:python
          upload: never
